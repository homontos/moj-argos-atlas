<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Atlas OSINT - Dane Satelitarne i Morskie</title>
    <!-- Biblioteka Mapowa Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; font-family: 'Segoe UI', Arial, sans-serif; }
        #map { width: 100%; height: 100vh; background-color: #1a1a1a; }
        .map-title {
            position: absolute; top: 15px; left: 60px; z-index: 1000;
            background: rgba(30, 30, 30, 0.9); color: #ffffff; padding: 15px; 
            border-radius: 8px; border: 1px solid #444; backdrop-filter: blur(5px);
        }
        .map-title h2 { margin: 0 0 5px 0; font-size: 18px; color: #00e676; text-transform: uppercase; letter-spacing: 1px; }
        .map-title p { margin: 0; font-size: 12px; color: #bbb; }
    </style>
</head>
<body>

    <div class="map-title">
        <h2>Custom ArgosAtlas v1.0</h2>
        <p>System automatycznego monitorowania OSINT</p>
    </div>

    <div id="map"></div>

    <script>
        // Inicjalizacja mapy ze standardowym widokiem na świat
        const map = L.map('map').setView([20.0, 10.0], 2);

        // Niezawodny, oficjalny podkład mapowy OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // Warstwy na dane
        const shipsLayer = L.layerGroup().addTo(map);
        const incidentsLayer = L.layerGroup().addTo(map);

        // Funkcja pobierająca bazę danych JSON
        async function loadData() {
            try {
                const response = await fetch('dane_osint.json');
                if (!response.ok) throw new Error('Nie znaleziono jeszcze pliku danych.');
                const data = await response.json();

                // Rysowanie pozycji statków
                if (data.statki) {
                    data.statki.forEach(ship => {
                        L.marker([ship.lat, ship.lon]) // Standardowy niebieski znacznik mapy
                            .bindPopup(`
                                <div style="color: #333;">
                                    <strong style="color: #0288d1;">🚢 POZYCJA JEDNOSTKI</strong><br><br>
                                    <b>Nazwa:</b> ${ship.nazwa}<br>
                                    <b>Bandera:</b> ${ship.bandera}<br>
                                    <b>Kurs:</b> ${ship.kurs}°<br>
                                    <b>Prędkość:</b> ${ship.predkosc} węzłów
                                </div>
                            `)
                            .addTo(shipsLayer);
                    });
                }

                // Rysowanie incydentów kryzysowych
                if (data.incydenty) {
                    data.incydenty.forEach(inc => {
                        L.marker([inc.lat, inc.lon]) // Standardowy znacznik mapy
                            .bindPopup(`
                                <div style="max-width: 250px; color: #333;">
                                    <strong style="color: #d32f2f;">⚠️ ALERT KRYZYSOWY / OSINT</strong><br><br>
                                    <b>Tytuł:</b> ${inc.tytul}<br>
                                    <b>Opis:</b> ${inc.opis}<br><br>
                                    <a href="${inc.link}" target="_blank" style="color: #d32f2f; font-weight: bold;">Zobacz źródło ↗</a>
                                </div>
                            `)
                            .addTo(incidentsLayer);
                    });
                }

            } catch (error) {
                console.error('Błąd ładowania pliku:', error);
            }
        }

        // Uruchomienie pobierania
        loadData();

        // Panel przełączania widoczności obiektów w prawym górnym rogu
        const overlayMaps = {
            "🚢 Ruch Statków (AIS)": shipsLayer,
            "⚠️ Incydenty i Alerty": incidentsLayer
        };
        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
    </script>
</body>
</html>
