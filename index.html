<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mój Atlas OSINT - Dane Satelitarne i Morskie</title>
    <!-- Biblioteka Mapowa Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #1a1a1a; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .map-title {
            position: absolute; top: 15px; left: 60px; z-index: 1000;
            background: rgba(30, 30, 30, 0.85); color: #ffffff; padding: 15px; 
            border-radius: 8px; border: 1px solid #444; backdrop-filter: blur(5px);
        }
        .map-title h2 { margin: 0 0 5px 0; font-size: 18px; color: #00e676; text-transform: uppercase; letter-spacing: 1px; }
        .map-title p { margin: 0; font-size: 12px; color: #bbb; }
    </style>
</head>
<body>

    <div class="map-title">
        <h2>Custom ArgosAtlas v1.0</h2>
        <p>System automatycznego monitorowania OSINT</p>
    </div>

    <div id="map"></div>

    <script>
        // Inicjalizacja mapy z widokiem globalnym
        const map = L.map('map').setView([20.0, 10.0], 3);

        // Stylowy, ciemny podkład mapowy (idealny do projektów OSINT)
        L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '© OpenStreetMap contributors © CARTO'
        }).addTo(map);

        // Warstwy na dane
        const shipsLayer = L.layerGroup().addTo(map);
        const incidentsLayer = L.layerGroup().addTo(map);

        // Definicja ikon mapy
        const redIcon = new L.Icon({
            iconUrl: 'https://githubusercontent.com',
            shadowUrl: 'https://cloudflare.com',
            iconSize:, iconAnchor:, popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        const blueIcon = new L.Icon({
            iconUrl: 'https://githubusercontent.com',
            shadowUrl: 'https://cloudflare.com',
            iconSize:, iconAnchor:, popupAnchor: [1, -34], shadowSize: [41, 41]
        });

        // Ładowanie danych wygenerowanych przez skrypt Python
        async function loadData() {
            try {
                const response = await fetch('dane_osint.json');
                if (!response.ok) throw new Error('Brak pliku danych. Poczekaj na uruchomienie bota.');
                const data = await response.json();

                // Rysowanie statków
                data.statki.forEach(ship => {
                    L.marker([ship.lat, ship.lon], { icon: blueIcon })
                        .bindPopup(`
                            <div style="font-family: Arial;">
                                <strong style="color: #0288d1;">🚢 POZYCJA JEDNOSTKI</strong><br><br>
                                <b>Nazwa:</b> ${ship.nazwa}<br>
                                <b>Bandera:</b> ${ship.bandera}<br>
                                <b>Kurs:</b> ${ship.kurs}° | <b>Prędkość:</b> ${ship.predkosc} węzłów
                            </div>
                        `)
                        .addTo(shipsLayer);
                });

                // Rysowanie incydentów
                data.incydenty.forEach(inc => {
                    L.marker([inc.lat, inc.lon], { icon: redIcon })
                        .bindPopup(`
                            <div style="font-family: Arial; max-width: 250px;">
                                <strong style="color: #d32f2f;">⚠️ ALERT KRYZYSOWY / OSINT</strong><br><br>
                                <b>Tytuł:</b> ${inc.tytul}<br>
                                <b>Opis:</b> ${inc.opis}<br>
                                <a href="${inc.link}" target="_blank" style="color: #d32f2f; font-weight: bold;">Zobacz źródło ↗</a>
                            </div>
                        `)
                        .addTo(incidentsLayer);
                });

            } catch (error) {
                console.error('Błąd podczas ładowania danych mapy:', error);
            }
        }

        // Uruchomienie funkcji
        loadData();

        // Panel boczny zarządzania warstwami
        const overlayMaps = {
            "<span style='color: #64b5f6; font-weight: bold;'>🚢 Ruch Statków (AIS)</span>": shipsLayer,
            "<span style='color: #e57373; font-weight: bold;'>⚠️ Incydenty i Alerty</span>": incidentsLayer
        };
        L.control.layers(null, overlayMaps, { collapsed: false }).addTo(map);
    </script>
</body>
</html>
