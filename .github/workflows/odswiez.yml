name: Auto-Odswiezanie Mapy OSINT

on:
  schedule:
    - cron: '0 */2 * * *' # Uruchamiaj automatycznie co 2 godziny
  workflow_dispatch: # Pozwala na ręczne uruchomienie przyciskiem w zakładce Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Pobranie kodu repozytorium
      uses: actions/checkout@v3

    - name: Konfiguracja Pythona
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Instalacja wymaganych bibliotek
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Uruchomienie skryptu pobierania danych OSINT
      run: python scraper.py

    - name: Automatyczne wgranie zaktualizowanych danych na serwer
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add dane_osint.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja danych: $(date)" && git push)
